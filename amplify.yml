# Amplify Hosting build for the web app (web/), with the headset workspace (vr/) built into
# web/public/vr first so the same origin serves both. The CREWOPS_* variables set in the
# Amplify console are only visible at build time, so they are written to .env.production for
# the Next.js server to read at runtime. The headset build needs Node 22.12 or later.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - (cd ../vr && npm ci && npm run build)
            - npm ci
        build:
          commands:
            - env | grep -E '^CREWOPS_' > .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
